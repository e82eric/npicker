[package]
name = "nfm-cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "Command-line fuzzy picker window built on nfm-egui"

[[bin]]
name = "nfm"
path = "src/main.rs"

[dependencies]
nfm-egui = { path = "../nfm-egui" }
nfm_search_core = { path = "../nfm-search-core" }
nfm-picker-sources = { path = "../nfm-picker-sources" }
nfm-preview = { path = "../nfm-preview" }
nfm-preview-file = { path = "../nfm-preview-file" }
nfm_file_system = { path = "../nfm-file-system" }
nfm-file-system-egui = { path = "../nfm-file-system-egui" }
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
raw-window-handle = "0.6"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
nfm-process-egui = { path = "../nfm-process-egui" }
nfm-window-egui = { path = "../nfm-window-egui" }
nfm-win32 = { path = "../nfm-win32" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

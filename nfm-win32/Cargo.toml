[package]
name = "nfm-win32"
version = "0.1.0"
edition = "2021"
description = "Windows enumeration, process actions and picker snapshots without a UI runtime"

[dependencies]
anyhow = "1"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
nfm_search_core = { path = "../nfm-search-core" }
nfm-picker-sources = { path = "../nfm-picker-sources" }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

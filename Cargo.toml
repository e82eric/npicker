[workspace]
members = [
    ".",
    "nfm-file-system",
    "nfm-file-system-egui",
    "nfm-process-egui",
    "nfm-window-egui",
    "nfm-picker-sources",
    "nfm-search-core",
    "nfm-egui",
    "nfm-egui-demo",
    "nfm-preview-vt",
    "nfm-preview-command",
    "nfm-win32",
    "nfm-preview",
]
resolver = "2"

[profile.release]
lto = "thin"

[package]
name = "nfm-rust-win32host"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_nfm"
crate-type = ["cdylib", "rlib"]

[features]
egui-previews = ["nfm-preview/egui"]

[dependencies]
nfm-win32 = { path = "nfm-win32" }
nfm-preview = { path = "nfm-preview" }
nfm-preview-command = { path = "nfm-preview-command" }
nfm_search_core = { path = "nfm-search-core" }
nfm-picker-sources = { path = "nfm-picker-sources" }
anyhow = "1"
crossbeam-channel = "0.5"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nfm_file_system = { path = "nfm-file-system" }
skia-safe = "0.97.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
